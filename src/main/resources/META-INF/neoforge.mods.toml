type="required"
versionRange="[21.1.235,21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="CLIENT"
[[dependencies.${mod_id}]]
modId="roughlyenoughitems"
type="optional"
versionRange="[16,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="CLIENT"
