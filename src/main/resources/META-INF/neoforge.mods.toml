modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/LemonadeSMP/oxidized-fork/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Adds more vanilla+ uses for copper.'''
logoFile="assets/oxidized/icon.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/oxidized"

[[mixins]]
config="oxidized.mixins.json"

[[dependencies.${mod_id}]]
